name: Validate changelog entries

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only — none of these jobs ever need to write back to the repo.
permissions:
  contents: read

jobs:
  schema:
    name: Schema + content rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Deps are pinned here (not in a PR-mutable requirements.txt) so a fork PR
      # can't swap in an arbitrary package.
      - name: Install dependencies
        run: pip install --no-cache-dir pyyaml==6.0.2

      - name: Run validator
        run: python .github/scripts/validate.py

  markdownlint:
    name: Markdown formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "entries/**/*.md"

  links:
    name: Link health (advisory)
    runs-on: ubuntu-latest
    # Advisory: vendor outages shouldn't block content from shipping.
    # The weekly cron job catches lasting rot and files an issue.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore lychee cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --timeout 10
            --max-retries 2
            --retry-wait-time 5
            --accept 200,206,429
            entries/**/*.md
          fail: true
